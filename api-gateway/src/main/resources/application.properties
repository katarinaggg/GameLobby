spring.application.name=api-gateway
server.port=8084

# Eureka
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

#
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Zuul
zuul.sensitiveHeaders=Cookie,Set-Cookie
zuul.ignored-headers=Access-Control-Allow-Credentials,Access-Control-Allow-Origin

# Optional: explicit routes
zuul.routes.user-service.path=/api/user/**
zuul.routes.user-service.service-id=user-service
zuul.routes.user-service.strip-prefix=false

zuul.routes.session-service.path=/api/sessions/**
zuul.routes.session-service.service-id=session-service
zuul.routes.session-service.strip-prefix=false

zuul.routes.notification-service.path=/api/notifications/**
zuul.routes.notification-service.service-id=notification-service
zuul.routes.notification-service.strip-prefix=false
