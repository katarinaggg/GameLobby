spring.application.name=session-service

# SERVER
server.port=8082
server.servlet.context-path=/api

# DATABASE (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/session_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sifrazabaze
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ACTIVEMQ (za asinhrone notifikacije)
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.packages.trust-all=true
session.notification.queue=notification_queue

# EUREKA CLIENT
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# SECURITY / JWT
jwt.secret=very_secret_key_for_user_service
jwt.expiration=86400000